<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>シフト一括入力</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:ital,wght@0,100..900;1,100..900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="reset.css">
  <link rel="stylesheet" href="style.css">

  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <script src="index.js"></script>
</head>
<body>
  <div id="result"></div>
  
  <!-- ▼ 追加：月選択ボタンエリア（最初は非表示） ▼ -->
  <div id="month-selector" style="display: none; text-align: center; margin: 30px 0;">
    <p style="margin-bottom: 20px; font-weight: bold; color: #333;">入力する月を選択してください</p>
    <button id="btn-current-month" style="padding: 12px 24px; margin: 0 10px; background-color: #06C755; color: white; border: none; border-radius: 8px; font-size: 16px; cursor: pointer;"></button>
    <button id="btn-next-month" style="padding: 12px 24px; margin: 0 10px; background-color: #06C755; color: white; border: none; border-radius: 8px; font-size: 16px; cursor: pointer;"></button>
  </div>
  <!-- ▲ ここまで ▲ -->

  <h1 id="page-title" class="title" style="display: none;"></h1>
  <p id="notice-text" style="display: none; text-align: center; font-size: 12px; color: #666; margin-bottom: 15px;">※14:00~15:00、16:50~17:00、18:50~19:00は休憩となります</p>
  <div id="shift-list"></div>
  <!-- 縦の位置がズレないように align-items: center; を追加しています -->
  <div class="button-container" style="display: flex; justify-content: center; align-items: center; gap: 20px; padding-bottom: 30px;">
    
    <!-- 背景や枠線を消して、画像だけがボタンとして機能するようにしています -->
    <button id="back-btn" style="display: none; background: none; border: none; cursor: pointer; padding: 0;">
      <img src="/images/left_arrow.png" alt="戻る" style="width: 40px; height: auto;">
    </button>

    <button id="submit-btn" style="display: none;">提出</button>
  </div>
</body>
</html>
